<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雨的小天地｜個人作品集＋部落格</title>
  <meta name="description" content="雨的個人作品集與學習手帳部落格，集中展示網站作品、Writeup 解題與生活記錄。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌧️</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- CDN: marked & DOMPurify 依 AGENTS.md 規範引入 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header class="site-header">
    <div class="container nav-container">
      <div class="brand-logo">
        <a href="index.html" class="brand-badge">
          <span>🌧️</span>
          <span>雨的小天地</span>
        </a>
      </div>
      <nav>
        <ul id="nav-links" class="nav-links">
          <!-- 由 app.js 動態讀取 categories.json 渲染 -->
        </ul>
      </nav>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="container">
    
    <!-- 1. 自我介紹區 (讀取 content/about.md) -->
    <section class="about-box">
      <div class="washi-tape"></div>
      <div class="about-header">
        <span>👋</span>
        <span>哈囉，歡迎來到這裡！</span>
      </div>
      <div id="about-content" class="about-content">
        <p>載入自我介紹中...</p>
      </div>
    </section>

    <!-- 2. 五個分類卡片 -->
    <section>
      <h2 class="section-title">✨ 探索內容分類</h2>
      <div id="categories-grid" class="categories-grid">
        <!-- 由 app.js 動態產生 -->
      </div>
    </section>

    <!-- 3. 最新文章列表 -->
    <section>
      <h2 class="section-title">📝 最新發布文章</h2>
      <div id="recent-posts-list" class="posts-list">
        <!-- 由 app.js 動態產生 -->
      </div>
    </section>

  </main>

  <!-- 頁尾 -->
  <footer class="site-footer">
    <div class="container">
      <p>© 2026 雨的小天地 ｜ 一步一腳印的學習手帳</p>
      <div class="footer-stamp">純靜態手帳風 ‧ 部署於 GitHub Pages</div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.initHome();
    });
  </script>
</body>
</html>
